<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Racha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090c0a;--card:#131814;--c2:#1b221c;--line:#273028;--lime:#c6ff3d;--txt:#f1f5ee;--mut:#8a978c;--A:#c6ff3d;--B:#ffb23d;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--txt);font:16px/1.4 Inter,system-ui,sans-serif;background:radial-gradient(120% 55% at 50% -10%,#22350f 0,var(--bg) 62%) fixed;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.disp{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:800;margin:0;line-height:.95}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.logo{font-size:30px;color:var(--lime);border:0;background:none;padding:0;cursor:pointer}
.dev{font-size:11px;color:var(--mut);border:1px dashed var(--line);padding:4px 9px;border-radius:99px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:700;cursor:pointer;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.p{background:var(--lime);color:#0b1000;box-shadow:0 10px 30px -10px #c6ff3dcc}
.s{background:var(--c2);color:var(--txt);border:1px solid var(--line)}
.sm{width:auto;padding:9px 13px;font-size:14px;border-radius:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
input,textarea{width:100%;background:#0d120e;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px;font:inherit;outline:0}
input:focus,textarea:focus{border-color:var(--lime)}
label{display:block;font-size:12px;color:var(--mut);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:8px;align-items:center}.col{display:grid;gap:8px}
.chip{flex:1;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--lime);color:#0b1000;border-color:var(--lime)}
.step{display:flex;align-items:center;gap:12px}.step b{min-width:34px;text-align:center;font-size:22px}
.step button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--c2);color:var(--txt);font-size:20px;cursor:pointer}
h2.disp{font-size:34px;margin-bottom:4px}.mut{color:var(--mut);font-size:14px}
.hero h1{font-size:58px;margin:18px 0 12px}.hero h1 em{color:var(--lime);font-style:normal}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
.demo .card h4{margin:0 0 8px;font-size:19px}
.demo .pl{padding:7px 10px;margin-top:6px;background:var(--c2);border-radius:10px;font-size:14px;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.95)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes glow{50%{box-shadow:0 0 28px -4px var(--g)}}
.pill{display:inline-block;background:var(--lime);color:#0b1000;font-weight:700;font-size:12px;padding:4px 10px;border-radius:99px}
.li{display:flex;gap:8px;align-items:center;margin-top:8px}
.li input{padding:11px}.li.bad input{border-color:#ff6b6b}
.x.on{background:var(--lime);border-color:var(--lime)}
.note.ok{background:#12220c;color:var(--lime)}
.tag{font-size:11px;color:#ff9b9b;white-space:nowrap}
.x{width:40px;height:40px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--c2);color:var(--txt);cursor:pointer}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;top:0;z-index:5;padding:8px 0;background:linear-gradient(var(--bg) 80%,transparent)}
.team{--g:var(--A);border-radius:var(--r);padding:10px;background:var(--card);border:1px solid var(--line);min-height:110px}
.team.B{--g:var(--B)}.team.on{border-color:var(--g);animation:glow 1.8s infinite}
.team h4{margin:0;font-size:20px;color:var(--g);display:flex;justify-content:space-between}
.team .m{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.team .m span{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--c2)}
.team .m span.new{animation:pop .45s}
.turn{margin:6px 0 12px;padding:14px;border-radius:var(--r);background:linear-gradient(90deg,#1d2b0c,var(--card));border:1px solid var(--line)}
.turn .disp{font-size:28px}
.pc{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;animation:rise .3s both}
.pc button{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;background:var(--lime);color:#0b1000;cursor:pointer}
details{margin-top:16px}summary{cursor:pointer;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--lime);color:#0b1000;font-weight:700;padding:11px 18px;border-radius:99px;animation:rise .3s;z-index:9}
.note{font-size:13px;color:#ffd27d;margin-top:10px;padding:10px;border-radius:10px;background:#2a2410}
.sq{margin-top:12px;border-radius:var(--r);padding:16px;border:1px solid var(--g);background:var(--card)}
.sq ol{margin:8px 0 0;padding-left:22px}.sq li{padding:4px 0}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
const APP_NAME='Racha'; // nome provisório: altere só aqui (e no <title>)
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const INV=/[\u200B-\u200F\u202A-\u202E\u2060-\u2064\uFEFF\u00AD]/g; // caracteres invisíveis que o WhatsApp costuma colar
const norm=s=>s.replace(INV,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const other=t=>t==='A'?'B':'A';

/* ========== 1. DOMÍNIO: regras do draft (funções puras, sem DOM) ========== */
const Draft={
  drawKeepers(ids){const gd={A:[],B:[]};let t=Math.random()<.5?'A':'B';ids.slice().sort(()=>Math.random()-.5).forEach(id=>{gd[t].push(id);t=other(t)});return gd},
  shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a},
  deal(n){this.shuffle(this.available(n)).forEach(p=>{const la=this.cap(n,'A')-n.teams.A.length,lb=this.cap(n,'B')-n.teams.B.length, // sorteio geral: enche os dois times por igual
      t=la>lb?'A':lb>la?'B':(Math.random()<.5?'A':'B');n.teams[t].push(p.id);n.history.push({n:n.history.length+1,team:t,playerId:p.id})});
    n.status='done';return this.settle(n)},
  create(c){const ci=c.capIds||{A:null,B:null},gkp=c.players.filter(p=>p.gk&&p.id!==ci.A&&p.id!==ci.B).map(p=>p.id);const st={id:c.id,name:c.name||'Rachão',mode:c.mode,size:c.size,
    captains:{A:c.capA||'Capitão 1',B:c.capB||'Capitão 2'},players:c.players.map(({id,name})=>({id,name})),capIds:ci,gkPool:gkp,gkDraw:this.drawKeepers(gkp),keepers:{A:[],B:[]},teams:{A:[],B:[]},
    order:{format:c.format,first:c.first,open:c.open,blk:c.blk},history:[],status:'drafting',createdAt:Date.now()};return c.format==='random'?this.deal(st):st},
  teamAt(st,i){const o=st.order,f=o.first,s=other(f);
    if(o.format==='alt')return i%2?s:f;
    if(o.format==='pairs')return (i>>1)%2?s:f;
    const op=o.open??1,b=o.blk??2;if(i<op)return f;return (i-op)%(2*b)<b?s:f}, // blocos: abertura + blocos alternados
  available(st){const u=new Set([...st.teams.A,...st.teams.B,...(st.gkPool||[]),...Object.values(st.capIds||{}).filter(Boolean)]);return st.players.filter(p=>!u.has(p.id))},
  cap(st,t){return st.size-1-((st.gkDraw||{})[t]||[]).length}, // capitão e goleiros contam no tamanho
  full(st,t){return st.teams[t].length>=this.cap(st,t)},
  nextCaptain(st){if(st.status==='done'||!this.available(st).length)return null;
    let t=this.teamAt(st,st.history.length);if(this.full(st,t)&&!this.full(st,other(t)))t=other(t);return t},
  blockAt(st,i){const o=st.order;if(o.format==='alt')return{s:i,n:1};if(o.format==='pairs')return{s:i-i%2,n:2};
    const op=o.open??1,b=o.blk??2;if(i<op)return{s:0,n:op};const j=i-op;return{s:op+j-j%b,n:b}},
  turnInfo(st){const t=this.nextCaptain(st);if(!t)return null;const i=st.history.length,av=this.available(st).length,
    left=this.cap(st,t)-st.teams[t].length;let room=left>0?Math.min(left,av):av,done=0;
    if(this.teamAt(st,i)===t){const b=this.blockAt(st,i);done=i-b.s;room=Math.min(b.n-done,room)}
    else{while(done<i&&st.history[i-1-done].team===t)done++} // time adversário completo: segue escolhendo
    return{team:t,pos:done+1,of:done+Math.max(room,1)}},
  select(st,pid,by){const t=this.nextCaptain(st);if(!t||(by&&by!==t)||!this.available(st).some(p=>p.id===pid))return st; // by: 'A'|'B'|'viewer'; sem by = aparelho local
    const n=structuredClone(st);n.teams[t].push(pid);n.history.push({n:n.history.length+1,team:t,playerId:pid});
    if(!this.nextCaptain(n))n.status='done';return this.settle(n)},
  undo(st){if(!st.history.length||st.order.format==='random')return st;const n=structuredClone(st),h=n.history.pop();
    n.teams[h.team]=n.teams[h.team].filter(i=>i!==h.playerId);n.keepers={A:[],B:[]};n.status='drafting';return n},
  reset(st){const n=structuredClone(st);n.teams={A:[],B:[]};n.history=[];n.keepers={A:[],B:[]};n.status='drafting';
    if(n.order.format==='random'){n.gkDraw=this.drawKeepers(n.gkPool||[]);return this.deal(n)}return n},
  finish(st){const n=structuredClone(st);n.status='done';return this.settle(n)},
  settle(n){n.keepers=n.keepers||{A:[],B:[]};n.gkDraw=n.gkDraw||this.drawKeepers(n.gkPool||[]); // goleiros sorteados no início, revelados ao final
    if(n.status==='done'&&!n.keepers.A.length&&!n.keepers.B.length)n.keepers=structuredClone(n.gkDraw);return n}
};

/* ========== 2. DADOS: contrato assíncrono. Troque LocalRepo por SupabaseRepo depois ========== */
const LocalRepo={
  mode:'local-demo',mem:{},subs:{},
  _get(c){try{return JSON.parse(localStorage.getItem('racha:'+c))}catch{return this.mem[c]||null}},
  _set(st){this.mem[st.id]=st;try{localStorage.setItem('racha:'+st.id,JSON.stringify(st));localStorage.setItem('racha:last',st.id)}catch{}},
  async createRoom(cfg){let id;do{id=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('')}while(this._get(id));
    const st=Draft.create({...cfg,id});this._set(st);return st},
  async joinRoom(code){const st=this._get(code.trim().toUpperCase());if(!st)throw new Error('Sala não encontrada neste aparelho.');return st},
  async getState(code){return this._get(code)},
  async _mut(code,fn,by){const cur=this._get(code);if(by==='viewer')return cur; // quem só acompanha nunca altera
    const st=fn(cur);this._set(st);return st},
  async getLast(){let id=null;try{id=localStorage.getItem('racha:last')}catch{}return id?this._get(id):null},
  selectPlayer(code,pid,by){return this._mut(code,s=>Draft.select(s,pid,by),by)},
  undoPick(code,by){return this._mut(code,s=>Draft.undo(s),by)},
  restart(code,by){return this._mut(code,s=>Draft.reset(s),by)},
  finishDraft(code,by){return this._mut(code,s=>Draft.finish(s),by)},
  subscribe(code,cb){const f=e=>{if(e.key==='racha:'+code&&e.newValue)cb(JSON.parse(e.newValue))};
    addEventListener('storage',f);return()=>removeEventListener('storage',f)}
};
/* PRÓXIMA ETAPA (Supabase). NADA disto existe ainda: hoje a sala vive só neste aparelho.
   • Tabela de salas com o estado (jsonb) e, para acesso, só tokens/hashes. No HTML entra apenas a chave pública (anon) + regras RLS; nunca chave secreta.
   • Links estáticos por hash (funciona no GitHub Pages; o hash não vai ao servidor): #v=ID_DE_VISUALIZAÇÃO (acompanhar) e #c=TOKEN (convite do 2º capitão).
     O criador é o Capitão 1: o token dele fica guardado no próprio aparelho, sem link extra.
   • Escrita só por funções no servidor (RPC) que validam o token e aplicam as mesmas regras do Draft (vez do capitão, parâmetro "by"); espectador só lê.
   • SupabaseRepo terá os mesmos métodos do LocalRepo; subscribe usará o Realtime da sala. */
const Repo=LocalRepo;
/* Futuro: importação por captura de tela, isolada do restante */
const ImageImport={available:false,async fromImage(){throw new Error('NAO_IMPLEMENTADO')}};

/* ========== 3. IMPORTAÇÃO: texto do WhatsApp -> lista revisável ========== */
const EMO=/[\p{Extended_Pictographic}\uFE0F\u200D\u20E3\u{1F3FB}-\u{1F3FF}]/gu;
const CHAT_S=/\d{1,2}\s?:\s?\d{2}|\b\d{1,2}\s?(?:h|hs|hr|hrs|horas?)\b|\d{1,2}\/\d{1,2}|[:=]|[?!]|r\$/i; // datas, horas, valores, ":" "=" "?" "!" em qualquer parte da linha
const CHAT_K=/\b(?:bora|galera|confirm\w*|vamos|quem|pessoal|bom dia|boa noite|obrigad\w*|rach[aã]o|lista|quadra|local|hor[aá]rio|valor|pix|vagas?|mensal(?:istas?)?|avulsos?|ausentes?|espera|vou)\b/i; // palavras de aviso (só no nome)
const GKW=/(?:^|[^\p{L}])(?:gol|goleiros?|goleira|gk|goalkeeper)(?![\p{L}])|\u{1F9E4}/iu; // sugestão de goleiro: palavra ou luva
function splitTag(s){const m=s.match(/^(.*?\p{L}.*?)(?:\s+[-–—|]\s*|\s*[(\[{])(.+)$/u); // "Nome - etiqueta" / "Nome (etiqueta)"
  return m?{name:m[1].trim(),note:m[2].replace(/[)\]}\s]+$/,'').trim()}:{name:s,note:''}}
function cleanName(o){return o.replace(INV,'').replace(EMO,'').replace(/[*~]/g,'').replace(/^\s*(\d{1,3}\s*[.)\-–:]\s*|[-•·]\s*|\d{1,3}\s+)/,'').replace(/\(?\b(goleiro|gk)\b\)?/gi,'').replace(/([^\s\-–—|(\[])\s+gol\s*$/i,'$1')
  .replace(/\s*[-–:]?\s*\(?\b(confirmad[oa]|presente)\b\)?\s*$/i,'').replace(/(\S)[-–](?:m|mensal(?:ista)?|avulso|av|conv(?:idado)?)\s*$/i,'$1') // só a forma colada "Nome-M"; com espaço, vira nota visível
  .replace(/\s+/g,' ').replace(/^[\s\-–.,:;]+|[\s\-–.,:;]+$/g,'')}
/* Capitão digitado x lista: compara sem maiúsculas/acentos/espaços extras; nunca liga os dois ao mesmo jogador */
function resolveCaps(list,names,pick){const r={A:{id:null,opts:[]},B:{id:null,opts:[]}},used=new Set();
  ['A','B'].forEach(t=>{const k=norm(names[t]||''),pk=pick[t],opts=k?list.filter(p=>norm(p.name)===k&&!used.has(p.id)):[];r[t].opts=opts;
    // prioridade: escolha manual (botão C ou pergunta) > nome igual na lista > sem associação
    const id=pk==='none'?null:pk&&list.some(p=>p.id===pk&&!used.has(p.id))?pk:opts.length===1?opts[0].id:null;
    r[t].id=id;if(id)used.add(id)});return r}
function parseNames(raw){const out=[],ignored=[];
  for(const line of raw.split(/\r?\n/)){const o=line.trim();if(!o)continue;
    const gm=o.replace(INV,'').match(/^\s*(?:gol|goleiros?|gk)\s*[:\-–]\s*(.+)$/i), // "Gol: Nome" = goleiro
      gk=!!gm||GKW.test(o.replace(INV,'')); // sugestão: o usuário pode mudar no 🧤
    const c0=cleanName(gm?gm[1]:o),sp=splitTag(c0),n=sp.name;
    if(!n||CHAT_S.test(c0)||CHAT_K.test(n)||/:\s*$/.test(o)||n.split(' ').length>6){ignored.push(o);continue} // nada é descartado em silêncio: vai para "ignoradas"
    out.push({id:uid(),name:n,note:sp.note,gk,odd:!/\p{L}/u.test(n)||n.length>30||n.split(' ').length>4||/[,;\/&]|\s+e\s+/i.test(n)})}
  return{out,ignored}}
const DEMO=['Rafa','Bruno','Léo','Dudu','Thiago','Gui','Mateus','Caio','Lucão','Pedrinho','Vini','Gabriel','Fernando','Jorginho'];

/* ========== 4. INTERFACE ========== */
/* ui.role: null = este aparelho escolhe pelos dois (modo local); 'A'/'B' = só o capitão daquele time; 'viewer' = só acompanha */
const ui={view:'home',cfg:{mode:'f7',size:8,capA:'',capB:'',name:'',format:'alt',open:1,blk:2,first:'A',gk:'draft'},
  raw:'',capPick:{A:null,B:null},list:[],ignored:[],room:null,q:'',resume:null,role:null,last:null,unsub:null};
const MODES={futsal:['Futsal',6,5],f7:['Futebol 7',8,7],campo:['Campo',12,11]}; // [nome, pessoas por time (c/ capitão e 1 reserva), em campo]
const dupIds=()=>{const seen=new Set(),d=new Set();ui.list.forEach(p=>{const k=norm(p.name);if(seen.has(k))d.add(p.id);seen.add(k)});return d};
const chip=(act,v,label,on)=>`<button class="chip ${on?'on':''}" data-act="${act}" data-v="${v}">${label}</button>`;
const stepper=(k,min,max)=>`<div class="step"><button data-act="step" data-k="${k}" data-d="-1">−</button><b>${ui.cfg[k]}</b><button data-act="step" data-k="${k}" data-d="1">+</button></div>`;
const shell=(body,back)=>`<div class="top"><button class="logo disp" data-act="go" data-v="home">⚽ ${APP_NAME}</button><span class="dev">Modo demonstração local · sem sincronização</span></div>${body}`;

function capsBlock(){const r=resolveCaps(ui.list,{A:ui.cfg.capA,B:ui.cfg.capB},ui.capPick);let h='';
  ['A','B'].forEach((t,k)=>{const nm=(ui.cfg[t==='A'?'capA':'capB']||'').trim(),o=r[t].opts;
    if(r[t].id)h+=`<div class="note ok">✓ ${esc(ui.list.find(p=>p.id===r[t].id).name)} será o capitão do Time ${k+1} e não aparece nas escolhas.</div>`;
    else if(o.length>1&&ui.capPick[t]!=='none')h+=`<div class="note">Há ${o.length} “${esc(nm)}” na lista. Qual é o capitão do Time ${k+1}?<div class="row" style="margin-top:8px;flex-wrap:wrap">${o.map(p=>`<button class="chip" style="flex:none;padding:10px 16px" data-act="cap" data-t="${t}" data-id="${p.id}">Linha ${ui.list.indexOf(p)+1}</button>`).join('')}</div></div>`;
    else if(t==='B'&&r.A.id&&nm&&norm(ui.cfg.capA)===norm(ui.cfg.capB))h+=`<div class="note">Os dois capitães têm o mesmo nome; só um pode ser ligado ao jogador da lista.</div>`;
    else if(nm&&ui.list.length&&ui.capPick[t]!=='none'){const k2=norm(nm),sim=ui.list.filter(p=>norm(p.name).includes(k2)||k2.includes(norm(p.name))).slice(0,2).map(p=>esc(p.name));
      h+=`<div class="note">“${esc(nm)}” não foi associado a ninguém da lista (só vale nome igual).${sim.length?` Parecido na lista: ${sim.join(', ')}.`:''} Ele entra como capitão mesmo assim.</div>`}});
  if(ui.list.length&&(!r.A.id||!r.B.id))h+=`<p class="mut" style="font-size:12px;margin:8px 0 0">Para escolher o capitão direto na lista, toque no <b>C</b> ao lado do nome.</p>`;return h}
function infoNotes(){if(!ui.list.length)return'';const r=resolveCaps(ui.list,{A:ui.cfg.capA,B:ui.cfg.capB},ui.capPick),ids=new Set([r.A.id,r.B.id].filter(Boolean)),
  sz=ui.cfg.size,total=ui.list.length+2-ids.size,df=total-2*sz;
  let h=`<div class="note ${df?'':'ok'}">${df>0?`Sobram ${df} pessoa(s) além das ${2*sz} vagas (${sz} por time): entram nos times como extras.`:df<0?`Faltam ${-df} pessoa(s) para ${2*sz} vagas (${sz} por time). Dá para seguir assim.`:`✓ ${total} pessoas: ${sz} por time.`}</div>`;
  if(ui.cfg.gk==='sorteio'){const k=ui.list.filter(p=>p.gk&&!ids.has(p.id)).length;
    h+=`<div class="note ${k===2?'ok':''}">🧤 ${k===0?'Nenhum goleiro marcado: o draft segue normal.':k===1?'Só 1 goleiro marcado, não há dois disponíveis. Ele será sorteado para um dos times; o outro define na hora. Dá para continuar.':k===2?'2 goleiros: um para cada time, sorteados no final.':`${k} goleiros: serão distribuídos alternadamente no sorteio final.`}</div>`}return h}
const V={
home:()=>`<div class="hero"><h1 class="disp">Monte os times.<br><em>Sem confusão.</em></h1>
<p class="mut" style="font-size:17px">O draft do seu rachão: dois capitães, uma lista de jogadores e a escolha na ordem certa.</p></div>
<div class="demo">${[['A','Time do Rafa',['Rafa ©','Bruno','Léo','Dudu']],['B','Time do Thiago',['Thiago ©','Gui','Mateus','Caio']]].map(([t,n,ps],i)=>
`<div class="card" style="border-color:var(--${t})"><h4 class="disp" style="color:var(--${t})">${n}</h4>${ps.map((p,j)=>`<div class="pl" style="animation-delay:${(j*2+i)*.35}s">${p}</div>`).join('')}</div>`).join('')}</div>
<div class="col"><button class="btn p" data-act="go" data-v="setup">Criar rachão</button>${ui.room||ui.resume?`<button class="btn s" data-act="resume">Continuar “${esc((ui.room||ui.resume).name)}”</button>`:''}</div>`,


setup:()=>{const c=ui.cfg;return`<h2 class="disp">Novo rachão</h2><p class="mut">Passo 1 de 2 · configuração</p>
<label>Nome da partida (opcional)</label><input data-k="name" value="${esc(c.name)}" placeholder="Rachão de quinta">
<label>Modalidade</label><div class="row">${Object.entries(MODES).map(([k,[n]])=>chip('mode',k,n,c.mode===k)).join('')}</div>
<label>Pessoas por time (capitão e reserva incluídos)</label>${stepper('size')}
<p class="mut" style="margin:6px 0 0">${(()=>{const f=MODES[c.mode][2],r=c.size-f;return r>=0?`${f} em campo + ${r} reserva(s)`:`menos que os ${f} necessários em campo`})()}</p>
<label>Capitães</label><div class="col"><input data-k="capA" value="${esc(c.capA)}" placeholder="Capitão 1"><input data-k="capB" value="${esc(c.capB)}" placeholder="Capitão 2"></div>
<p class="mut" style="margin:6px 0 0;font-size:12px">Digite o nome como aparece na lista de jogadores para evitar duplicação</p>
<label>Formato de escolha</label><div class="row">${chip('fmt','alt','Alternado',c.format==='alt')}${chip('fmt','blocks','Blocos',c.format==='blocks')}${chip('fmt','pairs','Duplas',c.format==='pairs')}</div>
<div class="row" style="margin-top:8px">${chip('fmt','random','🎲 Sorteio geral (sem escolha)',c.format==='random')}</div>
<p class="mut" style="margin:8px 0 0">${c.format==='random'?'Sorteio geral: todos são divididos ao acaso entre os dois times, sem escolha. Capitães e goleiros são respeitados.':c.format==='alt'?'1 jogador por turno para cada capitão.':c.format==='pairs'?'Cada capitão escolhe 2 por turno.':'O 1º capitão abre; depois os blocos se alternam e o 2º fecha completando o que faltar. Ex.: 1 – 2 – 2 – 2 … 1.'}</p>
${c.format==='blocks'?`<div class="row" style="margin-top:10px;justify-content:space-between"><span>1º capitão abre escolhendo</span>${stepper('open')}</div><div class="row" style="margin-top:8px;justify-content:space-between"><span>Depois, cada um escolhe</span>${stepper('blk')}</div>`:''}
${c.format==='random'?'':`<label>Quem começa escolhendo</label><div class="row">${chip('first','A',esc(c.capA||'Capitão 1'),c.first==='A')}${chip('first','B',esc(c.capB||'Capitão 2'),c.first==='B')}${chip('first','R','🎲 Sorteio',c.first==='R')}</div>`}
<label>Goleiros</label><div class="row">${chip('gkm','draft','Escolhidos no draft',c.gk==='draft')}${chip('gkm','sorteio','Sorteio no final',c.gk==='sorteio')}</div>
${c.gk==='sorteio'?'<p class="mut" style="margin:8px 0 0">Marque os goleiros (🧤) na lista de jogadores. Eles ficam fora do draft e cada time recebe um no final.</p>':''}
<div class="col" style="margin-top:24px"><button class="btn p" data-act="go" data-v="players">Continuar</button><button class="btn s" data-act="go" data-v="home">Voltar</button></div>`},

players:()=>{const d=dupIds(),bad=ui.list.filter(p=>p.odd).length,cr=resolveCaps(ui.list,{A:ui.cfg.capA,B:ui.cfg.capB},ui.capPick),
  role=id=>cr.A.id===id?'A':cr.B.id===id?'B':'',pend=['A','B'].some(t=>cr[t].opts.length>1&&!cr[t].id&&ui.capPick[t]!=='none');return`<h2 class="disp">Jogadores</h2><p class="mut">Passo 2 de 2 · cole a lista e revise antes de confirmar</p>
<label>Lista do WhatsApp</label><textarea id="raw" data-k="raw" rows="5" placeholder="1. Rafa&#10;2. Bruno&#10;3. Léo">${esc(ui.raw)}</textarea>
<div class="row" style="margin-top:8px"><button class="btn s sm" style="flex:1" data-act="parse">Processar lista</button><button class="btn s sm" style="flex:1" data-act="demo">Usar jogadores de teste</button></div>
<button class="btn s sm" style="width:100%;margin-top:8px" disabled>📷 Importar captura de tela · em breve</button>
${ui.ignored.length?`<details class="note"><summary>${ui.ignored.length} linha(s) ignoradas (cabeçalho, valores, avisos). Toque para ver e adicionar alguma, se for nome.</summary><div class="row" style="flex-wrap:wrap;margin-top:8px">${ui.ignored.map((x,i)=>`<button class="chip" style="flex:none;padding:8px 12px" data-act="addign" data-i="${i}">+ ${esc(x.slice(0,30))}</button>`).join('')}</div></details>`:''}
<label>Confirmados (${ui.list.length})</label>
${ui.list.map((p,i)=>`<div class="li ${p.odd||d.has(p.id)?'bad':''}"><span class="mut" style="width:20px;text-align:right;flex:none">${i+1}</span><input data-i="${i}" value="${esc(p.name)}">${p.note?`<span class="mut" title="Texto tirado do nome" style="font-size:11px;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.note)}</span>`:''}${d.has(p.id)?'<span class="tag">repetido</span>':p.odd?'<span class="tag">revisar</span><button class="x" data-act="keep" data-i="${i}" title="Está certo">✓</button>':''}<button class="x ${role(p.id)?'on':''}" data-act="capr" data-i="${i}" title="Definir capitão">${role(p.id)?'C'+(role(p.id)==='A'?1:2):'C'}</button>${ui.cfg.gk==='sorteio'?`<button class="x ${p.gk?'on':''}" data-act="gk" data-i="${i}">🧤</button>`:''}<button class="x" data-act="rmp" data-i="${i}">✕</button></div>`).join('')||'<p class="mut">Ninguém ainda.</p>'}
<div class="li"><input id="addp" placeholder="Adicionar jogador manualmente"><button class="btn p sm" data-act="addp">+</button></div>
${d.size?`<button class="btn s sm" style="width:100%;margin-top:12px" data-act="dedup">Remover ${d.size} duplicado(s)</button>`:''}
${bad?`<div class="note">${bad} nome(s) marcados como “revisar”. Corrija ou remova antes de começar.</div>`:''}
${capsBlock()}${infoNotes()}<div class="col" style="margin-top:22px"><button class="btn p" data-act="start" ${ui.list.length<2||bad||pend?'disabled':''}>Começar a escolha</button><button class="btn s" data-act="go" data-v="setup">Voltar</button></div>`},

lobby:()=>{const s=ui.room,rd=s.order.format==='random';return`<h2 class="disp">${rd?'Times sorteados':'Chame o outro capitão'}</h2><p class="mut">${esc(s.name)}</p>
<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><span>Capitão 1 · você</span><b>${esc(s.captains.A)}</b></div>
<div class="row" style="justify-content:space-between;margin-top:8px"><span>Capitão 2</span><b>${esc(s.captains.B)}</b></div>
${rd?'':`<div class="mut" style="margin-top:10px">Começa escolhendo: <b style="color:var(--lime)">${esc(s.captains[s.order.first])}</b>${ui.cfg.first==='R'?' (sorteado)':''}</div>`}</div>
<div class="col" style="margin-top:16px"><button class="btn s" disabled>Compartilhar convite do outro capitão</button><button class="btn s" disabled>Compartilhar link para acompanhar</button></div>
<div class="note">Pendente: os links só vão existir quando o Supabase estiver conectado. Por enquanto, siga e escolha pelos dois times neste aparelho.</div>
<div class="col" style="margin-top:16px"><button class="btn p" data-act="enter">${rd?'Ver times sorteados':'Entrar no draft'}</button></div>`},
draft:()=>{const s=ui.room,cap=Draft.nextCaptain(s),ti=Draft.turnInfo(s),pn=id=>esc(s.players.find(p=>p.id===id)?.name||'');
return`<div class="top" style="margin-bottom:0"><span class="mut">${esc(s.name)}</span><span class="dev">Demonstração local</span></div>
<div class="teams">${['A','B'].map(t=>`<div class="team ${t} ${cap===t?'on':''}"><h4 class="disp"><span>${esc(s.captains[t])} ©</span><span>${s.teams[t].length+1}/${s.size}</span></h4><div class="m">${s.teams[t].map((id,i)=>`<span class="${ui.last===id?'new':''}">${pn(id)}</span>`).join('')||'<span class="mut">vazio</span>'}</div></div>`).join('')}</div>
<div class="turn">${cap?`<span class="pill">Escolha ${ti.pos} de ${ti.of}</span><div class="disp" style="color:var(--${cap});margin-top:6px">Vez de ${esc(s.captains[cap])}</div>`:'<div class="disp">Escolha encerrada</div>'}
<div class="mut" style="margin-top:4px">${Draft.available(s).length} jogador(es) restante(s)${(s.gkPool||[]).length?` · 🧤 ${s.gkPool.length} goleiro(s) no sorteio final`:''}</div></div>
<input id="q" placeholder="🔍 Buscar jogador" value="${esc(ui.q)}">
<div id="plist">${V.plist()}</div>
<details><summary>Histórico (${s.history.length})</summary>${s.history.slice().reverse().map(h=>`<div class="pc" style="animation:none"><span>#${h.n} ${pn(h.playerId)}</span><span class="mut">→ ${esc(s.captains[h.team])}</span></div>`).join('')||'<p class="mut">Nada ainda.</p>'}</details>
<div class="row" style="margin-top:18px"><button class="btn s sm" style="flex:1" data-act="undo" ${s.history.length?'':'disabled'}>↶ Desfazer</button><button class="btn s sm" style="flex:1" data-act="finish">Encerrar agora</button></div>`},

plist:()=>{const s=ui.room,cap=Draft.nextCaptain(s),q=norm(ui.q);
return Draft.available(s).filter(p=>norm(p.name).includes(q)).map(p=>`<div class="pc"><b>${esc(p.name)}</b><button data-act="pick" data-id="${p.id}" ${cap&&(!ui.role||ui.role===cap)?'':'disabled'}>Escolher</button></div>`).join('')||'<p class="mut">Nenhum jogador encontrado.</p>'},

final:()=>{const s=ui.room,pn=id=>esc(s.players.find(p=>p.id===id)?.name||''),left=Draft.available(s);
return`<h2 class="disp">Times definidos 🔥</h2><p class="mut">${esc(s.name)}</p>
${['A','B'].map(t=>`<div class="sq" style="--g:var(--${t})"><h2 class="disp" style="color:var(--${t});font-size:30px">Time ${esc(s.captains[t])} <small class="mut" style="font:600 14px Inter,sans-serif;text-transform:none">${1+(s.keepers?.[t]||[]).length+s.teams[t].length} pessoas</small></h2><ol><li><b>${esc(s.captains[t])}</b> (capitão)</li>${(s.keepers?.[t]||[]).map(id=>`<li>🧤 ${pn(id)} (goleiro)</li>`).join('')}${s.teams[t].map(id=>`<li>${pn(id)}</li>`).join('')}</ol></div>`).join('')}
${left.length?`<div class="note">Ficaram de fora: ${left.map(p=>esc(p.name)).join(', ')}</div>`:''}
<pre class="card" style="white-space:pre-wrap;font:inherit;font-size:14px;margin:18px 0 0">${esc(resultText())}</pre>
<div class="col" style="margin-top:12px"><button class="btn p" data-act="copy">Copiar resultado</button>${navigator.share?'<button class="btn s" data-act="share">Compartilhar</button>':''}
${s.order.format==='random'?'<button class="btn s" data-act="restart">🎲 Sortear de novo</button>':'<button class="btn s" data-act="undo">↶ Desfazer última escolha</button><button class="btn s" data-act="restart">Refazer o draft</button>'}<button class="btn s" data-act="newgame">Novo rachão</button></div>`}
};
function resultText(s=ui.room){const pn=id=>s.players.find(p=>p.id===id)?.name;
  return `⚽ ${s.name.toUpperCase()}\n\n`+['A','B'].map((t,k)=>{const m=[s.captains[t],...(s.keepers?.[t]||[]).map(id=>`${pn(id)} (goleiro)`),...s.teams[t].map(pn)];
    return `*TIME ${k+1}*\n\n`+m.map((n,i)=>`${i+1}. ${n}`).join('\n')}).join('\n\n')}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),1800)}
function render(){let v=ui.view;if(v==='draft'&&ui.room.status==='done')v='final';if(v==='final'&&ui.room.status!=='done')v='draft';
  ui.view=v;const y=scrollY,ch=v!==ui.shown,ae=document.activeElement, // só volta ao topo ao TROCAR de tela
    f=!ch&&ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)?{t:ae.tagName.toLowerCase(),id:ae.id,i:ae.dataset.i,k:ae.dataset.k,a:ae.selectionStart,b:ae.selectionEnd}:null;
  ui.shown=v;$('#app').innerHTML=(v==='draft'?'':shell(''))+V[v]();scrollTo(0,ch?0:y);
  if(f){const el=$(f.id?'#'+f.id:f.i!==undefined?`${f.t}[data-i="${f.i}"]`:f.k?`${f.t}[data-k="${f.k}"]`:'#nada');
    if(el){el.focus({preventScroll:true});try{el.setSelectionRange(f.a,f.b)}catch{}}}}
function openRoom(st,view='draft'){ui.room=st;ui.view=view;ui.unsub&&ui.unsub();ui.unsub=Repo.subscribe(st.id,n=>{ui.room=n;render()});render()}

const A={
go:d=>{ui.view=d.v;ui.err='';render()},
mode:d=>{ui.cfg.mode=d.v;ui.cfg.size=MODES[d.v][1];render()},
fmt:d=>{ui.cfg.format=d.v;render()},first:d=>{ui.cfg.first=d.v;render()},
gkm:d=>{ui.cfg.gk=d.v;render()},cap:d=>{ui.capPick[d.t]=d.id;render()},
capr:d=>{const p=ui.list[+d.i],r=resolveCaps(ui.list,{A:ui.cfg.capA,B:ui.cfg.capB},ui.capPick),cur=r.A.id===p.id?'A':r.B.id===p.id?'B':'', // C: nenhum → capitão 1 → capitão 2 → nenhum
    drop=t=>{const k=t==='A'?'capA':'capB';ui.capPick[t]='none';if(norm(ui.cfg[k]||'')===norm(p.name))ui.cfg[k]=''};
  if(!cur)ui.capPick.A=p.id;else if(cur==='A'){drop('A');ui.capPick.B=p.id}else drop('B');render()},keep:d=>{ui.list[+d.i].odd=false;render()},
addign:d=>{const x=ui.ignored.splice(+d.i,1)[0];ui.list.push({id:uid(),name:cleanName(x)||x,odd:true});render()},gk:d=>{const p=ui.list[+d.i];p.gk=!p.gk;render()},
step:d=>{const k=d.k,lim=k==='size'?[2,20]:[1,5];ui.cfg[k]=Math.min(lim[1],Math.max(lim[0],ui.cfg[k]+ +d.d));render()},
parse:()=>{const r=parseNames(ui.raw);ui.list.push(...r.out);ui.ignored=r.ignored;ui.raw='';
  if(r.out.some(p=>p.gk)&&ui.cfg.gk!=='sorteio'){ui.cfg.gk='sorteio';toast('Goleiros achados na lista: sorteio no final ativado')}render()},
demo:()=>{ui.list=DEMO.map(n=>({id:uid(),name:n}));ui.ignored=[];render()},
addp:()=>{const i=$('#addp'),n=i.value.trim();if(!n)return;ui.list.push({id:uid(),name:n});render();$('#addp').focus()},
rmp:d=>{ui.list.splice(+d.i,1);render()},
dedup:()=>{const seen=new Set();ui.list=ui.list.filter(p=>{const k=norm(p.name);if(seen.has(k))return false;seen.add(k);return true});render()},
start:async()=>{const c={...ui.cfg},rnd=c.first==='R',r=resolveCaps(ui.list,{A:c.capA,B:c.capB},ui.capPick);
  if(['A','B'].some(t=>r[t].opts.length>1&&!r[t].id&&ui.capPick[t]!=='none'))return;
  if(rnd)c.first=Math.random()<.5?'A':'B'; // sorteado uma única vez e gravado na sala
  const nm=t=>r[t].id?ui.list.find(p=>p.id===r[t].id).name:c['cap'+t];
  openRoom(await Repo.createRoom({...c,capA:nm('A'),capB:nm('B'),capIds:{A:r.A.id,B:r.B.id},players:ui.list.map(({id,name,gk})=>({id,name,gk:c.gk==='sorteio'&&!!gk}))}),'lobby')},
  enter:()=>{ui.view='draft';render()},
resume:async()=>{const s=await Repo.getLast();if(s)openRoom(s)}, // reabre o último rachão salvo neste aparelho
pick:async d=>{const t=Draft.nextCaptain(ui.room);if(ui.role&&ui.role!==t)return;const nm=ui.room.players.find(p=>p.id===d.id).name;ui.last=d.id;
  ui.room=await Repo.selectPlayer(ui.room.id,d.id,ui.role||undefined);toast(`${nm} → ${ui.room.captains[t]}`);navigator.vibrate?.(30);render()},
undo:async()=>{ui.last=null;ui.room=await Repo.undoPick(ui.room.id);render()},
finish:async()=>{ui.room=await Repo.finishDraft(ui.room.id);render()},
restart:async()=>{ui.room=await Repo.restart(ui.room.id);render()},
newgame:()=>{ui.view='setup';ui.list=[];ui.ignored=[];ui.capPick={A:null,B:null};ui.room=null;render()},
copy:async()=>{const t=resultText();let ok=false;const a=document.createElement('textarea');a.value=t;a.readOnly=true;a.style.cssText='position:fixed;opacity:0';
  document.body.append(a);a.select();a.setSelectionRange(0,1e6);try{ok=document.execCommand('copy')}catch{}a.remove();
  if(!ok)try{await navigator.clipboard.writeText(t);ok=true}catch{}
  toast(ok?'Resultado copiado!':'Não deu para copiar: segure o texto e copie')},
share:()=>navigator.share({title:ui.room.name,text:resultText()}).catch(()=>{})
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)A[t.dataset.act]?.(t.dataset)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.i!==undefined){const p=ui.list[+t.dataset.i];p.name=t.value;p.odd=false;return}
  if(t.id==='q'){ui.q=t.value;$('#plist').innerHTML=V.plist();return}
  const k=t.dataset.k;if(!k)return;
  if(k==='raw')ui.raw=t.value;else ui.cfg[k]=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='addp')A.addp()});
render();
Repo.getLast().then(st=>{if(st){ui.resume=st;if(ui.view==='home')render()}});
</script>
</body></html>
